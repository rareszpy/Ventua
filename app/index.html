<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ventua</title>
<meta name="description" content="Notes, tasks, calendar and habits in one place, where everything lives on a day.">
<meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27%23111113%27/%3E%3Cpath d=%27M10 10.5l6 11%27 stroke=%27%23fff%27 stroke-width=%273.4%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M16 21.5l6-11%27 stroke=%27%23F25C2A%27 stroke-width=%273.4%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. A floating sidebar, and a main column whose home is the day: a note beside its
   schedule. Cool neutrals, one bright tangerine accent, Geist throughout with mono labels. */
:root {
  --bg: #F6F6F7; --panel: #EFEFF1; --surface: #FFFFFF; --ink: #111113; --muted: #686872; --faint: #A1A1AA;
  --line: #E4E4E7; --accent: #F25C2A; --accent-ink: #CF4317; --accent-soft: rgba(242,92,42,.11); --on-accent: #FFFFFF;
  --ev: color-mix(in srgb, var(--accent) 11%, var(--surface)); --ev-line: var(--accent); --danger: #DC2626; --good: #16A34A;
  --shadow: 0 12px 32px -12px rgba(17,17,19,.22);
  --display: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C0C0E; --panel: #131316; --surface: #19191D; --ink: #F4F4F5; --muted: #A1A1AA; --faint: #62626B;
  --line: #27272C; --accent: #FF7A45; --accent-ink: #FF946A; --accent-soft: rgba(255,122,69,.14); --on-accent: #0C0C0E;
  --danger: #F87171; --good: #4ADE80; --shadow: 0 16px 40px -14px rgba(0,0,0,.75); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0C0C0E; --panel: #131316; --surface: #19191D; --ink: #F4F4F5; --muted: #A1A1AA; --faint: #62626B;
  --line: #27272C; --accent: #FF7A45; --accent-ink: #FF946A; --accent-soft: rgba(255,122,69,.14); --on-accent: #0C0C0E;
  --danger: #F87171; --good: #4ADE80; --shadow: 0 16px 40px -14px rgba(0,0,0,.75); color-scheme: dark }

:root[data-accent="blue"] { --accent: #2F6BFF; --accent-ink: #1F55E0; --accent-soft: rgba(47,107,255,.11) }
:root[data-accent="green"] { --accent: #12A150; --accent-ink: #0D8541; --accent-soft: rgba(18,161,80,.12) }
:root[data-accent="pink"] { --accent: #E5397A; --accent-ink: #C42563; --accent-soft: rgba(229,57,122,.11) }
@media (prefers-color-scheme: dark) {
  :root[data-accent="blue"]:not([data-theme="light"]) { --accent: #6F98FF; --accent-ink: #8CADFF; --accent-soft: rgba(111,152,255,.15) }
  :root[data-accent="green"]:not([data-theme="light"]) { --accent: #3DD68C; --accent-ink: #5FE3A2; --accent-soft: rgba(61,214,140,.14) }
  :root[data-accent="pink"]:not([data-theme="light"]) { --accent: #FF6FA3; --accent-ink: #FF8DB6; --accent-soft: rgba(255,111,163,.15) } }
:root[data-theme="dark"][data-accent="blue"] { --accent: #6F98FF; --accent-ink: #8CADFF; --accent-soft: rgba(111,152,255,.15) }
:root[data-theme="dark"][data-accent="green"] { --accent: #3DD68C; --accent-ink: #5FE3A2; --accent-soft: rgba(61,214,140,.14) }
:root[data-theme="dark"][data-accent="pink"] { --accent: #FF6FA3; --accent-ink: #FF8DB6; --accent-soft: rgba(255,111,163,.15) }

* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--text); letter-spacing: -.006em; font-feature-settings: "ss01"; -webkit-font-smoothing: antialiased; overflow: hidden }
button, input { font: inherit; color: inherit }
a { color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.display { font-family: var(--display); font-weight: 600; letter-spacing: -.045em; margin: 0; line-height: 1.02; text-wrap: balance }
.eyebrow { font: 500 11.5px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--accent-ink) }
.muted { color: var(--muted) }
.tnum { font-variant-numeric: tabular-nums }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100% }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; margin: 10px 0 10px 10px; display: flex; flex-direction: column; min-height: 0; padding: 14px 10px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04) }
.svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; text-decoration: none; color: inherit }
.brand .mark { width: 30px; height: 30px; flex: none; display: block; filter: drop-shadow(0 3px 8px color-mix(in srgb, var(--accent) 30%, transparent)) }
.brand .mark rect { fill: var(--ink) }
.brand .mark .l { stroke: var(--bg) }
.brand .mark .r { stroke: var(--accent) }
.brand .wm { font: 680 21px/1 var(--display); letter-spacing: -.055em; color: var(--ink); padding-bottom: 1px }
.brand .wm i { font-style: normal; color: var(--accent) }
.search { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px 0 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; color: var(--muted); font-size: 14px; text-align: left; margin-bottom: 12px; transition: border-color .15s }
.search:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)) }
.search .svg { width: 16px; height: 16px }
.search kbd, .kbd { margin-left: auto; font: 700 10.5px var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--muted) }
.nav { display: grid; gap: 2px }
.nav a, .plist a { display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 10px; border-radius: 11px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; min-width: 0; transition: background .12s, color .12s }
.nav a:hover, .plist a:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink) }
.nav a.on, .plist a.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px var(--line) }
.nav a.on .svg { color: var(--accent) }
.nav .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 11.5px; font-weight: 800; display: grid; place-items: center }
.sec { display: flex; align-items: center; justify-content: space-between; padding: 18px 10px 4px }
.sec span { font: 700 12px var(--text); color: var(--faint) }
.iconbtn { border: 0; background: none; color: var(--muted); width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; line-height: 1; flex: none }
.iconbtn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink) }
.iconbtn .svg { width: 17px; height: 17px }
.plist { overflow: auto; min-height: 0; flex: 1; display: grid; align-content: start; gap: 1px; margin: 0 -2px; padding: 0 2px }
.plist a { height: 34px; font-weight: 500 }
.plist a .svg { width: 16px; height: 16px; opacity: .75 }
.plist a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.plist a.untitled span { color: var(--faint) }
.foot { border-top: 1px solid var(--line); margin-top: 6px; padding: 8px 0 0; display: grid; gap: 2px }
.foot .st { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; color: var(--muted); padding: 4px 10px 0 }
.foot .st i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none }
.foot .st.cloud i { background: var(--good) }
.foot .st.sync i { background: var(--accent); animation: blink 1s infinite }
@keyframes blink { 50% { opacity: .3 } }
.foot .st span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

.main { overflow: auto; min-width: 0; position: relative }
.topbar { display: none }
.view { padding: 34px 44px 80px; max-width: 1180px; margin: 0 auto }
.btn, .seg, .addrow input, .addrow .btn { border-radius: 10px }
.card { border-radius: 16px }

/* ---------- settings ---------- */
.set { max-width: 760px; display: grid; gap: 34px }
.set h2 { font: 650 18px var(--display); letter-spacing: -.03em; margin: 0 0 4px }
.set .desc { color: var(--muted); font-size: 14px; margin: 0 0 14px }
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.tcard { border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); padding: 8px 8px 10px; text-align: left; display: grid; gap: 8px; font-weight: 700; font-size: 14px }
.tcard:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)) }
.tcard.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.tcard .pv { height: 74px; border-radius: 9px; display: grid; grid-template-columns: 30% 1fr; overflow: hidden; border: 1px solid rgba(128,128,128,.25) }
.tcard .pv i { display: block }
.pv.fog i:first-child { background: #EFEFF1 } .pv.fog i:last-child { background: #F6F6F7; background-image: linear-gradient(#111113 0 0), linear-gradient(#E4E4E7 0 0), linear-gradient(#E4E4E7 0 0); background-size: 50% 6px, 70% 4px, 60% 4px; background-position: 12px 14px, 12px 30px, 12px 40px; background-repeat: no-repeat }
.pv.night i:first-child { background: #131316 } .pv.night i:last-child { background: #0C0C0E; background-image: linear-gradient(#F4F4F5 0 0), linear-gradient(#27272C 0 0), linear-gradient(#27272C 0 0); background-size: 50% 6px, 70% 4px, 60% 4px; background-position: 12px 14px, 12px 30px, 12px 40px; background-repeat: no-repeat }
.pv.sys { grid-template-columns: 1fr 1fr } .pv.sys i:first-child { background: #F6F6F7 } .pv.sys i:last-child { background: #0C0C0E }
.accents { display: flex; gap: 12px; flex-wrap: wrap }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 0 1.5px var(--line); padding: 0 }
.sw.on { box-shadow: 0 0 0 2.5px var(--ink) }
.srow { display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); flex-wrap: wrap }
.srow + .srow { margin-top: 10px }
.srow b { display: block; font-size: 14.5px }
.srow span.m { color: var(--muted); font-size: 13.5px }
.srow > div { min-width: 0; flex: 1 1 260px }
.switch { width: 44px; height: 26px; border-radius: 999px; border: 0; background: var(--line); position: relative; padding: 0; flex: none; transition: background .15s }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s }
.switch[aria-checked="true"] { background: var(--accent) }
.switch[aria-checked="true"]::after { transform: translateX(18px) }
.switch:disabled { opacity: .45; cursor: not-allowed }
.kbds { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: 14px; align-items: center }
.kbds kbd { font: 700 11.5px var(--text); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; justify-self: start }

/* ---------- day ---------- */
.dayhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 28px }
.dayhead h1 { font-size: clamp(42px, 5.4vw, 64px) }
.dayhead .sub { font: 500 18px/1.3 var(--text); color: var(--muted); margin-top: 8px; letter-spacing: -.02em }
.dayhead .meta { margin-bottom: 12px }
.dh-right { display: grid; gap: 12px; justify-items: end }
.navbtns { display: flex; gap: 6px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: border-color .12s, background .12s }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.btn.danger { color: var(--danger) }
.week { display: grid; grid-template-columns: repeat(7, 40px); gap: 4px }
.week a { display: grid; justify-items: center; gap: 1px; padding: 6px 0 5px; border-radius: 9px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 700 }
.week a b { font: 600 16px/1.2 var(--text); color: var(--ink); letter-spacing: -.02em }
.week a i { width: 4px; height: 4px; border-radius: 50%; background: transparent }
.week a i.has { background: var(--accent) }
.week a:hover { background: var(--accent-soft) }
.week a.on { background: var(--ink); color: var(--bg) }
.week a.on b { color: var(--bg) }
.week a.today:not(.on) b { color: var(--accent-ink) }

.daygrid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 40px; align-items: start }
.cards { display: grid; gap: 16px; position: sticky; top: 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; min-width: 0 }
.card h3 { margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; font: 500 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
.card h3 a, .card h3 button { font: 700 12px var(--text); letter-spacing: 0; text-transform: none; color: var(--accent-ink); text-decoration: none; border: 0; background: none; padding: 0 }

/* timeline */
.tl-wrap { height: 430px; overflow: auto; margin: 0 -14px -12px; border-top: 1px solid var(--line); border-radius: 0 0 14px 14px }
.tl { position: relative; height: calc(24 * var(--hr)); margin-left: 50px; --hr: 44px; cursor: copy }
.tl .hr { position: absolute; left: -50px; right: 0; height: var(--hr); border-top: 1px solid var(--line); pointer-events: none }
.tl .hr span { position: absolute; left: 8px; top: -8px; font-size: 11px; color: var(--faint); background: var(--surface); padding: 0 3px; font-weight: 600 }
.tl .hr:first-child span { display: none }
.tl .now { position: absolute; left: -6px; right: 0; height: 2px; background: var(--accent); pointer-events: none; z-index: 3 }
.tl .now::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent) }
.ev { position: absolute; left: 4px; right: 8px; background: var(--ev); border-left: 3px solid var(--ev-line); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; line-height: 1.3; overflow: hidden; cursor: grab; z-index: 2; touch-action: none; user-select: none }
.ev b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.ev small { color: var(--muted); font-weight: 600 }
.ev.short b { display: inline; margin-right: 6px }
.ev .rs { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize }
.ev.drag { cursor: grabbing; box-shadow: var(--shadow); z-index: 4 }
.ev.sel { outline: 2px solid var(--accent) }

.hchips { display: flex; flex-wrap: wrap; gap: 6px }
.hchip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px 5px 7px; font-size: 13px; font-weight: 600 }
.hchip i { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; font-style: normal; font-size: 10px }
.hchip.done { background: var(--accent-soft); border-color: transparent }
.hchip.done i { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.empty-note { font-size: 13px; color: var(--muted); margin: 0 }
.empty-note a { color: var(--accent-ink) }
.links { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }
.links a { display: block; padding: 5px 8px; margin: 0 -8px; border-radius: 7px; text-decoration: none; font-weight: 600; font-size: 14px }
.links a:hover { background: var(--accent-soft) }

/* ---------- editor ---------- */
.editor { padding-bottom: 40vh; cursor: text; min-height: 200px }
.blk { position: relative; display: flex; gap: 9px; align-items: flex-start; padding: 1px 0 }
.txt { flex: 1; min-width: 0; outline: none; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 0; caret-color: var(--accent) }
.txt:empty::before { content: attr(data-ph); color: var(--faint); pointer-events: none }
.blk[data-t="p"] .txt:empty::before { content: none }
.blk[data-t="p"].focus .txt:empty::before, .editor.blank .blk[data-t="p"]:first-child .txt:empty::before { content: attr(data-ph) }
.blk[data-t="h1"] { margin-top: 22px }
.blk[data-t="h1"] .txt { font: 650 28px/1.25 var(--display); letter-spacing: -.035em }
.blk[data-t="h2"] { margin-top: 16px }
.blk[data-t="h2"] .txt { font: 620 20px/1.35 var(--display); letter-spacing: -.025em }
.blk[data-t="h3"] { margin-top: 10px }
.blk[data-t="h3"] .txt { font: 500 12px/2 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--accent-ink) }
.editor > .blk:first-child { margin-top: 0 }
.blk[data-t="quote"] .txt { border-left: 3px solid var(--accent); padding-left: 16px; font-size: 16px; color: var(--muted) }
.mk { flex: none; min-width: 20px; display: flex; justify-content: center; padding-top: 1px; line-height: 1.7; user-select: none }
.bul::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-top: 10px }
.num { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums }
.chk { flex: none; width: 18px; height: 18px; margin: 4px 1px 0; border: 1.6px solid var(--muted); border-radius: 5px; background: transparent; padding: 0; display: grid; place-items: center }
.chk:hover { border-color: var(--accent) }
[data-c="1"] > .chk, .chk.done { background: var(--accent); border-color: var(--accent) }
[data-c="1"] > .chk::after, .chk.done::after { content: ""; width: 9px; height: 5px; border: solid var(--on-accent); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px) }
.blk[data-c="1"] .txt { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--line) }
.blk[data-t="hr"] { padding: 12px 0 }
.hrline { height: 1px; background: var(--line); width: 100%; outline-offset: 6px }
.chip { display: inline; padding: 1px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; font-size: .93em; text-decoration: none; cursor: pointer; white-space: nowrap; font-style: normal; font-family: var(--text); text-transform: none; letter-spacing: 0 }
.chip:hover { text-decoration: underline }
.chip[data-ref^="p:"]::before { content: "↗ "; opacity: .7 }
code { font: 13px ui-monospace, "SF Mono", Menlo, monospace; background: var(--panel); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px }

/* ---------- page ---------- */
.pagebar { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 26px; flex-wrap: wrap }
.pagebar .sp { flex: 1 }
.pwrap { max-width: 760px; margin: 0 auto }
.ptitle { font-size: clamp(36px, 5vw, 52px); outline: none; margin-bottom: 18px; caret-color: var(--accent) }
.ptitle:empty::before { content: "Untitled"; color: var(--faint) }
.backlinks { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 18px }

/* ---------- calendar ---------- */
.vhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px }
.vhead h1 { font-size: clamp(38px, 5vw, 56px) }
.vhead h1 em { font-style: normal; font-weight: 500; color: var(--faint); font-size: .5em; letter-spacing: -.02em }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface) }
.seg a { padding: 6px 12px; font-size: 13px; font-weight: 700; text-decoration: none; color: var(--muted) }
.seg a.on { background: var(--ink); color: var(--bg) }
.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface) }
.month .dn { padding: 8px 10px; font: 500 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel) }
.cell { min-height: 118px; padding: 7px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.cell:hover { background: var(--accent-soft) }
.cell.out { background: var(--panel) }

<script>
"use strict";
/* =====================================================================
   Ventua — notes, tasks, calendar and habits, where everything lives on a day.
   Data: an in-memory state, cached in localStorage, and (inside claude.ai)
   synced to a private per-user store via the `db` capability.
   ===================================================================== */

// ---------- utilities ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2, 8)).replace(/[^a-z0-9]/g, "");
const now = () => Date.now();
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const compact = d => ymd(d).replace(/-/g, "");
const fromYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fromCompact = s => new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const sameDay = (a, b) => ymd(a) === ymd(b);
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const wd = d => (d.getDay() + 6) % 7; // Monday = 0
const startOfWeek = d => addDays(d, -wd(d));
const isoWeek = d => { const t = new Date(d); t.setDate(t.getDate() + 3 - wd(t)); const y1 = new Date(t.getFullYear(), 0, 4); return 1 + Math.round(((t - y1) / 864e5 - 3 + wd(y1)) / 7); };
const fmtShort = d => `${DAYS[wd(d)].slice(0, 3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}${d.getFullYear() !== today().getFullYear() ? " " + d.getFullYear() : ""}`;
const fmtLong = d => `${DAYS[wd(d)]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const relDay = d => { const n = Math.round((d - today()) / 864e5); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n === -1 ? "Yesterday" : n > 0 ? `In ${n} days` : `${-n} days ago`; };
const ago = t => { const s = (now() - t) / 1000; if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} h ago`; return fmtShort(new Date(t)); };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
const txtOf = h => (h || "").replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
const chipHTML = ref => `<a class="chip" contenteditable="false" data-ref="${ref}">${esc(refLabel(ref))}</a>`;
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

// Natural-ish date parsing for @mentions and the command bar
function parseDateQuery(q) {
  q = (q || "").trim().toLowerCase().replace(/,/g, "");
  if (!q) return null;
  const t = today();
  if ("today".startsWith(q) && q.length >= 3) return t;
  if ("tomorrow".startsWith(q) && q.length >= 3) return addDays(t, 1);
  if ("yesterday".startsWith(q) && q.length >= 3) return addDays(t, -1);
  let m;
  if ((m = q.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return valid(new Date(+m[1], +m[2] - 1, +m[3]));
  if ((m = q.match(/^(?:in\s+)?\+?(\d{1,3})\s*(d|day|days|w|week|weeks)$/))) return addDays(t, +m[1] * (m[2][0] === "w" ? 7 : 1));
  const dayIdx = s => DAYS.findIndex(n => s.length >= 3 && n.toLowerCase().startsWith(s));
  if ((m = q.match(/^(next\s+)?([a-z]+)$/)) && dayIdx(m[2]) >= 0) {
    const n = (dayIdx(m[2]) - wd(t) + 7) % 7 || 7; return addDays(t, n);
  }
  const monIdx = s => MONTHS.findIndex(n => s.length >= 3 && n.toLowerCase().startsWith(s));
  if ((m = q.match(/^(\d{1,2})\s+([a-z]+)(?:\s+(\d{4}))?$/)) && monIdx(m[2]) >= 0) return guessYear(+m[1], monIdx(m[2]), m[3]);
  if ((m = q.match(/^([a-z]+)\s+(\d{1,2})(?:\s+(\d{4}))?$/)) && monIdx(m[1]) >= 0) return guessYear(+m[2], monIdx(m[1]), m[3]);
  return null;
  function valid(d) { return isNaN(d) ? null : d; }
  function guessYear(day, mon, yr) {
    if (yr) return valid(new Date(+yr, mon, day));
    let d = new Date(t.getFullYear(), mon, day);
    if (d < addDays(t, -60)) d = new Date(t.getFullYear() + 1, mon, day);
    return valid(d);
  }
}

// ---------- state ----------
const LS = "ventua:v1";
let state = { pages: {}, events: {}, habits: {}, touched: false, version: 0 };
const COLL = { page: "pages", event: "events", habit: "habits" };

function sample() {
  const t = today(), D = n => ymd(addDays(t, n)), C = n => chipHTML("d:" + D(n));
  const P = (id, title, blocks, extra = {}) => ({ id, kind: "page", title, blocks: blocks.map(([t, h, c]) => ({ id: uid(), t, h: h || "", c: !!c })), created: now(), updated: now(), ...extra });
  const pages = {};
  pages.welcome = P("welcome", "Welcome to Ventua", [
    ["quote", "This is example content so you can see how Ventua works. Edit it, or delete it from the page menu."],
    ["p", "Ventua keeps your notes, tasks, calendar and habits together. Every day has its own page, and anything you write can point at a day."],
    ["h2", "Try these"],
    ["todo", "Type <b>/</b> on a new line for headings, to-dos, lists and more"],
    ["todo", `Type <b>@</b> to link a date or a page, like ${C(2)}`],
    ["todo", "Open Ventua", true],
    ["todo", `Press <b>${isMac ? "⌘K" : "Ctrl K"}</b> to search everything or jump to any date`],
    ["h2", "How it fits together"],
    ["ul", "<b>Today</b> is your day: a note, your schedule, habits, and anything due."],

// ---------- calendar ----------
function viewMonth(main, y, m) {
  const first = new Date(y, m, 1), start = startOfWeek(first), t = today(), I = ix();
  const weeks = Math.ceil((wd(first) + new Date(y, m + 1, 0).getDate()) / 7);
  const prev = new Date(y, m - 1, 1), next = new Date(y, m + 1, 1);
  let cells = DAYS.map(d => `<div class="dn">${d.slice(0, 3)}</div>`).join("");
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i), k = ymd(d), evs = I.evBy.get(k) || [];
    const pg = state.pages[dayPageId(k)], note = pg ? (pg.blocks || []).map(b => b.t !== "todo" ? txtOf(b.h).trim() : "").find(Boolean) : "";
    const tasks = I.tasks.filter(x => x.due === k), done = tasks.filter(x => x.done).length;
    cells += `<a class="cell${d.getMonth() !== m ? " out" : ""}${sameDay(d, t) ? " today" : ""}" href="#day-${compact(d)}" aria-label="${fmtLong(d)}">
      <span class="n">${d.getDate()}</span>

      ${note ? `<span class="nt">${esc(note)}</span>` : ""}

    <div class="vhead"><h1 class="display">${MONTHS[m]} <em>${y}</em></h1>
      <div class="ctl"><span class="seg"><a class="on" href="#calendar-${y}${pad(m + 1)}">Month</a><a href="#year-${y}">Year</a></span>
      <a class="btn" href="#calendar-${prev.getFullYear()}${pad(prev.getMonth() + 1)}" aria-label="Previous month">←</a><a class="btn" href="#calendar">Today</a><a class="btn" href="#calendar-${next.getFullYear()}${pad(next.getMonth() + 1)}" aria-label="Next month">→</a></div></div>
    <div class="month">${cells}</div></div>`;
}
function viewYear(main, y) {
  const t = today(); let days = 0, evc = 0, hc = 0;
  const I = ix();
  for (const [k, l] of I.dayText) if (k.startsWith(y + "-") && l > 0) days++;
  for (const e of Object.values(state.events)) if (e.date.startsWith(y + "-")) evc++;

  const months = MONTHS.map((name, m) => {
    const first = new Date(y, m, 1), n = new Date(y, m + 1, 0).getDate();
    let g = "<span></span>".repeat(wd(first));

      g += `<a href="#day-${compact(dt)}" class="l${s}${sameDay(dt, t) ? " today" : ""}" title="${fmtLong(dt)}" aria-label="${fmtLong(dt)}"></a>`; }
    return `<div class="ym"><h4><a href="#calendar-${y}${pad(m + 1)}">${name}</a></h4><div class="yg">${g}</div></div>`;

function bindTasks(root, redraw) {

let showDone = false;

    <form class="addrow" id="addtask"><input id="newtask" placeholder="Add a to-do. End with @fri, @3d or @dec 24 to set a due date" autocomplete="off" aria-label="New to-do for today"><button class="btn primary" type="submit">Add</button></form>
    <div id="tg">${groups.map(([cls, name, list]) => `<section class="group ${cls}"><h2>${name} <small>${list.length}</small></h2>${list.map(taskRow).join("")}</section>`).join("")

    ${done.length ? `<section class="group"><button class="linkbtn" type="button" id="tog-done">${showDone ? "Hide" : "Show"} ${done.length} completed</button>${showDone ? done.map(taskRow).join("") : ""}</section>` : ""}</div></div>`;

// "Call mum @ fri" -> text "Call mum", due Friday. Only a trailing @ that parses as a date counts.
function splitDue(v) {
  const m = v.match(/^(.*?)\s*@\s*([^@]+)$/);
  const d = m && parseDateQuery(m[2]);
  return d && m[1].trim() ? { text: m[1].trim(), due: d } : { text: v, due: null };
}

}
function pageMd(blocks) {
  const pre = { h1: "# ", h2: "## ", h3: "### ", ul: "- ", ol: "1. ", quote: "> " };
  return (blocks || []).map(b => b.t === "hr" ? "---" : b.t === "todo" ? (b.c ? "[x] " : "[ ] ") + chipText(b.h) : (pre[b.t] || "") + chipText(b.h)).filter(l => l.trim()).join("\n");
}
function insertBlocksAfter(anchor, blocks) {
  if (!blocks.length || !editing) return;
  let ref = anchor;
  const replace = anchor.dataset.t !== "hr" && !anchor.textContent.trim();
  for (const b of blocks) { const nb = makeBlock(b); ref.after(nb); ref = nb; }
  if (replace && anchor.parentNode.children.length > 1) anchor.remove();
  focusBlock(ref, true); changed(true);
}

// In-editor AI: a card below the cursor that streams, then Insert / Try again / Discard
function aiBox(anchor, mode) {
  $$(".aibox").forEach(b => b.remove());
  const page = editing.page, box = document.createElement("div");
  box.className = "aibox"; box.contentEditable = "false"; anchor.after(box);
  const titles = { ask: "Ask AI", continue: "Continue writing", summarize: "Summary", todos: "To-dos from this page" };
  const hd = `<div class="hd">✦ ${titles[mode]}</div>`;
  let ctl = null;
  const close = () => { if (ctl) ctl.abort(); box.remove(); const t = txtOfBlk(anchor); t && caretEdge(t, true); };
  box.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); } });
  if (mode === "ask") {
    box.innerHTML = hd + `<form><input id="ai-q" placeholder="e.g. draft an agenda for the offsite, or plan a 3-day trip" autocomplete="off" aria-label="What should AI write?"><button class="btn primary" type="submit">Write</button><button class="btn" type="button" data-x>Cancel</button></form>`;
    $("[data-x]", box).onclick = close;
    $("form", box).onsubmit = e => { e.preventDefault(); const q = $("#ai-q", box).value.trim(); if (q) run(q); };
    $("#ai-q", box).focus();
  } else run();

  function prompt(q) {
    const where = page.kind === "day" ? `the daily note for ${fmtLong(fromYmd(page.date))}` : `a page titled "${page.title || "Untitled"}"`;
    const body = pageMd(readBlocks(editing.root)) || "(empty so far)";
    const cursor = chipText(txtOfBlk(anchor) ? txtOfBlk(anchor).innerHTML : "").trim();
    const task = {
      ask: `The writer asks: "${q}". Write what should be inserted into the note at the cursor. Keep it practical and concise.`,
      continue: `Continue writing from the cursor, matching the writer's voice and language. Add 1 to 3 short paragraphs or list items of NEW text only; do not repeat what's there.`,
      summarize: `Summarize this note in 3 to 5 bullet points ("- "). Be specific; keep names, numbers and dates.`,
      todos: `Turn the action items in this note into to-dos, one per line starting with "[] ". If an item has a clear day, append it as @YYYY-MM-DD. Skip anything that's already a to-do. If there are no action items, reply with a single to-do suggesting a next step.`,
    }[mode];
    return `You are helping someone write in Ventua, their notes and planning app. Today is ${fmtLong(today())} (${ymd(today())}).\n\n${task}\n\nThe note is ${where}. The cursor is after the line: "${cursor || "(empty line)"}".\n\n--- NOTE ---\n${body}\n--- END NOTE ---\n\n${AI_FORMAT}`;
  }
  function run(q) {
    ctl = new AbortController();
    box.innerHTML = hd + `<div class="out wait">Thinking…</div><div class="row"><button class="btn" type="button" data-stop>Stop</button></div>`;
    const out = $(".out", box);
    $("[data-stop]", box).onclick = () => ctl.abort();
    AI(prompt(q), { signal: ctl.signal, cache: false, modelTier: mode === "ask" ? "default" : "quick", onText: ({ text }) => { out.classList.remove("wait"); out.textContent = text; } })
      .then(({ text, truncated }) => done(text, truncated ? "The answer was cut short." : ""))
      .catch(e => { if (e && e.code === "cancelled") return e.text ? done(e.text, "Stopped early.") : close(); fail(aiErr(e), e && e.text); });
    function done(text, note) {
      ctl = null; out.classList.remove("wait"); out.textContent = text;
      const row = $(".row", box);
      row.innerHTML = `<button class="btn primary" type="button" data-in>Insert</button><button class="btn" type="button" data-again>Try again</button><span class="sp"></span>${note ? `<span class="muted" style="font-size:12px">${esc(note)}</span>` : ""}<button class="btn" type="button" data-x>Discard</button>`;
      $("[data-in]", row).onclick = () => { const bl = linesToBlocks(text); box.remove(); insertBlocksAfter(anchor, bl); toast(`Inserted ${bl.length} block${bl.length === 1 ? "" : "s"}`); };
      $("[data-again]", row).onclick = () => run(q);
      $("[data-x]", row).onclick = close;
      $("[data-in]", row).focus();
    }
    function fail(msg, partial) {
      ctl = null; out.classList.remove("wait"); out.textContent = partial || "";
      const row = $(".row", box);
      row.innerHTML = `<div class="ai-err">${esc(msg)}</div><span class="sp"></span>${aiReady() ? `<button class="btn" type="button" data-again>Try again</button>` : ""}<button class="btn" type="button" data-x>Close</button>`;
      const ag = $("[data-again]", row); if (ag) ag.onclick = () => run(q);
      $("[data-x]", row).onclick = close;
    }
  }
}

function aiPanel(title, sub) {
  closeAll();
  const scrim = document.createElement("div"); scrim.className = "scrim";
  scrim.innerHTML = `<div class="aipanel" role="dialog" aria-label="${esc(title)}"><div class="hd">✦ AI</div><h2>${esc(title)}</h2><p class="muted" style="margin:0;font-size:14px">${esc(sub)}</p><div class="body"></div><div class="row"></div></div>`;
  document.body.appendChild(scrim);
  const ctl = new AbortController();
  const close = () => { ctl.abort(); scrim.remove(); };
  scrim.addEventListener("mousedown", e => { if (e.target === scrim) close(); });
  scrim.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  return { scrim, body: $(".body", scrim), row: $(".row", scrim), ctl, close };
}

// Plan my day: JSON plan from tasks + events + note, previewed before anything is added
function planDay(key) {
  if (!aiReady()) return;
  flushEditor();
  const date = fromYmd(key), isToday = key === ymd(today()), I = ix();
  const evs = I.evBy.get(key) || [];
  const tasks = I.tasks.filter(t => !t.done && (!t.due || t.due <= key)).sort((a, b) => (a.due || "9").localeCompare(b.due || "9")).slice(0, 20);
  const note = pageMd((state.pages[dayPageId(key)] || {}).blocks).slice(0, 1500);
  const habits = Object.values(state.habits).filter(h => !(h.days && h.days[key])).map(h => h.name);
  const nowM = isToday ? Math.ceil((new Date().getHours() * 60 + new Date().getMinutes()) / 15) * 15 : 0;
  const earliest = Math.max(7 * 60, nowM);
  const P = aiPanel(`Plan for ${fmtShort(date)}`, isToday ? `From ${fmtMin(earliest)}, around your ${evs.length} event${evs.length === 1 ? "" : "s"}.` : `Around your ${evs.length} event${evs.length === 1 ? "" : "s"} that day.`);
  if (earliest >= 21 * 60) { P.body.innerHTML = `<p class="muted">It's late, so there's not much day left to plan. Try planning tomorrow instead.</p>`; P.row.innerHTML = `<span class="sp"></span><button class="btn" type="button">Close</button>`; P.row.lastChild.onclick = P.close; return; }
  const prompt = `Plan a realistic day in someone's calendar app. The day is ${fmtLong(date)}${isToday ? `; it is now ${fmtMin(nowM)}` : ""}.

Fixed events (do not move or overlap these):
${evs.map(e => `- ${fmtMin(e.start)}-${fmtMin(e.end)} ${e.title || "Busy"}`).join("\n") || "- none"}

Open tasks (number: text, due date if any):
${tasks.map((t, i) => `${i + 1}: ${chipText(t.block.h).trim()}${t.due ? ` (due ${t.due}${t.due < key ? ", OVERDUE" : ""})` : ""}`).join("\n") || "none"}

Habits not yet done that day: ${habits.join("; ") || "none"}
Their note for the day:
${note || "(empty)"}

Make time blocks for the most important work. Rules: start no earlier than ${fmtMin(earliest)}, end by 22:00, use 15-minute steps, never overlap fixed events or each other, at most 7 blocks, give overdue and due-today tasks priority, batch small tasks together, leave breathing room, and fit a habit in only if it naturally takes time (like a walk). Titles under 40 characters.

Reply with only JSON in this shape: {"summary": "one short sentence about the plan", "blocks": [{"title": "Deep work: launch outline", "start": "10:00", "end": "11:30", "task": 2}]} where "task" is the task number it covers, or null.`;
  P.body.innerHTML = `<div class="out wait">Thinking about your day…</div>`;
  P.row.innerHTML = `<span class="sp"></span><button class="btn" type="button">Stop</button>`; P.row.lastChild.onclick = P.close;
  AI.json(prompt, { signal: P.ctl.signal, cache: false, modelTier: "default" }).then(res => {
    const toM = v => { const m = String(v || "").match(/^(\d{1,2}):(\d{2})$/); return m ? Math.min(1440, +m[1] * 60 + +m[2]) : NaN; };
    const taken = evs.map(e => [e.start, e.end]);
    const blocks = (Array.isArray(res && res.blocks) ? res.blocks : []).map(b => ({ title: String(b.title || "").slice(0, 80).trim(), start: toM(b.start), end: toM(b.end) }))
      .filter(b => b.title && b.start >= earliest - 15 && b.end > b.start && b.end <= 1440)
      .sort((a, b) => a.start - b.start)
      .filter(b => { if (taken.some(([s, e]) => b.start < e && b.end > s)) return false; taken.push([b.start, b.end]); return true; });
    if (!blocks.length) { P.body.innerHTML = `<p class="muted">AI couldn't find a sensible plan around your events. Try again, or add a few tasks first.</p>`; P.row.innerHTML = `<span class="sp"></span><button class="btn" type="button">Close</button>`; P.row.lastChild.onclick = P.close; return; }
    P.body.innerHTML = `${res.summary ? `<p style="margin:14px 0 0">${esc(String(res.summary))}</p>` : ""}<ul class="plan">${blocks.map((b, i) => `<li><label><input type="checkbox" checked data-i="${i}"><span class="tm">${fmtMin(b.start)}–${fmtMin(b.end)}</span><span class="ttl">${esc(b.title)}</span></label></li>`).join("")}</ul>`;
    P.row.innerHTML = `<button class="btn" type="button" data-again>Try again</button><span class="sp"></span><button class="btn" type="button" data-x>Cancel</button><button class="btn primary" type="button" data-add>Add to schedule</button>`;
    const upd = () => { const n = $$(".plan input:checked", P.body).length; const b = $("[data-add]", P.row); b.textContent = n ? `Add ${n} to schedule` : "Add to schedule"; b.disabled = !n; };
    P.body.onchange = upd; upd();
    $("[data-x]", P.row).onclick = P.close;
    $("[data-again]", P.row).onclick = () => { P.close(); planDay(key); };
    $("[data-add]", P.row).onclick = () => {
      const pick = $$(".plan input:checked", P.body).map(i => blocks[+i.dataset.i]);
      pick.forEach(b => Store.put("event", { id: uid(), date: key, start: b.start, end: b.end, title: b.title }));
      P.close(); toast(`Added ${pick.length} block${pick.length === 1 ? "" : "s"} to your schedule`);
      if (route().v === "day") softRender();
    };
  }).catch(e => {
    if (e && e.code === "cancelled") return;
    P.body.innerHTML = `<div class="ai-err">${esc(aiErr(e))}</div>`;
    P.row.innerHTML = `<span class="sp"></span><button class="btn" type="button">Close</button>`; P.row.lastChild.onclick = P.close;
  });
}

// Weekly review: streams a written review of the last 7 days; can be saved as a page
function reviewWeek() {
  if (!aiReady()) return;
  flushEditor();
  const t = today(), I = ix(), days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
  const doneN = I.tasks.filter(x => x.done && x.due && x.due >= ymd(days[0]) && x.due <= ymd(t)).length;
  const lines = days.map(d => {
    const k = ymd(d), evs = I.evBy.get(k) || [], note = pageMd((state.pages[dayPageId(k)] || {}).blocks).slice(0, 900);
    const tasks = I.tasks.filter(x => x.due === k), hab = Object.values(state.habits).filter(h => h.days && h.days[k]).map(h => h.name);
    return `## ${fmtLong(d)}\nEvents: ${evs.map(e => `${fmtMin(e.start)} ${e.title || "Busy"}`).join("; ") || "none"}\nTasks due: ${tasks.map(x => `${x.done ? "[done]" : "[open]"} ${chipText(x.block.h).trim()}`).join("; ") || "none"}\nHabits done: ${hab.join("; ") || "none"}\nNote:\n${note || "(none)"}`;
  }).join("\n\n");
  const overdue = I.tasks.filter(x => !x.done && x.due && x.due < ymd(t)).length;
  const prompt = `Write a short, warm, specific weekly review for the person whose planner this is. Today is ${fmtLong(t)} (${ymd(t)}).
Sections, in this order: "## What got done", "## What slipped", "## Patterns" (habits, energy, how time was spent; point to specific days), "## Focus for next week" with exactly 3 to-dos starting with "[] ", each with an @YYYY-MM-DD date in the next 7 days. Under 220 words. Don't invent facts that aren't in the data.

Totals: ${doneN} dated tasks completed this week, ${overdue} tasks overdue, habits tracked: ${Object.values(state.habits).map(h => h.name).join("; ") || "none"}.

${lines}

${AI_FORMAT}`;
  const P = aiPanel(`Week ${isoWeek(t)} review`, `${fmtShort(days[0])} to ${fmtShort(t)}`);
  const out = document.createElement("div"); out.className = "out wait"; out.textContent = "Reading your week…"; P.body.appendChild(out);
  P.row.innerHTML = `<span class="sp"></span><button class="btn" type="button">Stop</button>`; P.row.lastChild.onclick = () => P.ctl.abort();
  const finish = text => {
    out.classList.remove("wait"); out.textContent = text;
    P.row.innerHTML = `<button class="btn" type="button" data-again>Try again</button><span class="sp"></span><button class="btn" type="button" data-x>Close</button><button class="btn primary" type="button" data-save>Save as page</button>`;
    $("[data-x]", P.row).onclick = P.close;
    $("[data-again]", P.row).onclick = () => { P.close(); reviewWeek(); };
    $("[data-save]", P.row).onclick = () => {
      const p = newPageObj(`Week ${isoWeek(t)} review`); p.blocks = linesToBlocks(text).map(b => ({ id: uid(), ...b, c: !!b.c }));
      Store.put("page", p); P.close(); go("page-" + p.id); toast("Review saved");
    };
  };
  AI(prompt, { signal: P.ctl.signal, cache: false, modelTier: "default", onText: ({ text }) => { out.classList.remove("wait"); out.textContent = text; } })
    .then(({ text }) => finish(text))
    .catch(e => {
      if (e && e.code === "cancelled") { if (e.text && document.body.contains(P.scrim)) finish(e.text); return; }
      out.classList.remove("wait"); out.textContent = (e && e.text) || "";
      P.body.insertAdjacentHTML("beforeend", `<div class="ai-err">${esc(aiErr(e))}</div>`);
      P.row.innerHTML = `<span class="sp"></span><button class="btn" type="button">Close</button>`; P.row.lastChild.onclick = P.close;
    });
}

// ---------- global wiring ----------
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { e.preventDefault(); flushEditor(); goRef(chip.dataset.ref); }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
  else if (e.key === "Escape") closeAll();
  else if (e.altKey && !e.metaKey && !e.ctrlKey && !(document.activeElement && (document.activeElement.isContentEditable || /INPUT|TEXTAREA/.test(document.activeElement.tagName)))) {
    const r = route(), k = e.code;
    if ((k === "ArrowLeft" || k === "ArrowRight") && r.v === "day") { e.preventDefault(); go("day-" + compact(addDays(r.date, k === "ArrowLeft" ? -1 : 1))); }
    else if (k === "KeyT") { e.preventDefault(); go("today"); }
    else if (k === "KeyN") { e.preventDefault(); newPage(); }
  }
});
$("#open-cmd").onclick = openPalette;
$("#top-search").onclick = openPalette;
$("#new-page").onclick = newPage;
$("#burger").onclick = () => $("#app").classList.toggle("drawer");
$("#app").addEventListener("click", e => { if (e.target === $("#app")) $("#app").classList.remove("drawer"); });
$("#kbd").textContent = isMac ? "⌘K" : "Ctrl K";
addEventListener("pagehide", flushEditor);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushEditor(); });
// keep "Today" honest across midnight
let lastDay = ymd(today());
setInterval(() => { if (ymd(today()) !== lastDay) { lastDay = ymd(today()); softRender(); } else if ($("#tl") && !$(".evpop")) { const n = $(".tl .now"); if (n) { const d = new Date(); n.style.top = (d.getHours() + d.getMinutes() / 60) * 44 + "px"; } } }, 60000);

applyTheme();
loadLocal();
render();
initCloud();
initAI();
initSupabase();
</script>
